---
layout: base.njk
title: Home
---

<section class="hero">
  <div class="hero-content">
    <h1>{{ hero_title }}</h1>
    <p>{{ hero_text }}</p>

    <a href="{{ hero_button_link }}" class="btn">
      {{ hero_button_text }}
    </a>
  </div>
</section>

<section class="about-preview">
  <h2>{{ about_title }}</h2>
  <p>{{ about_text }}</p>
</section>

<section class="cta">
  <h2>{{ cta_title }}</h2>

  <a href="{{ cta_button_link }}" class="btn">
    {{ cta_button_text }}
  </a>
</section>
