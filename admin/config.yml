backend:
  name: github
  repo: etcenterprise/ets-website
  branch: eleventy
  base_url: https://ets-cms-auth.etcenterprise24.workers.dev

local_backend: false

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Project Title"
        name: "title"
        widget: "string"

      - label: "Client"
        name: "client"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Description"
        name: "body"
        widget: "markdown"

  - name: "services"
    label: "Services"
    folder: "_services"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Service Name"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "body"
        widget: "markdown"
  - name: "audit"
    label: "Audit & Financial Solutions"
    folder: "_audit"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Client"
        name: "client"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Description"
        name: "body"
        widget: "markdown"
  - name: "pages"
    label: "Website Pages"

    files:

      - label: "Home Page"
        name: "home"
        file: "_content/home.md"

        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Content"
            name: "body"
            widget: "markdown"

      - label: "About Page"
        name: "about"
        file: "_content/about.md"

        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Content"
            name: "body"
            widget: "markdown"

      - label: "Contact Page"
        name: "contact"
        file: "_content/contact.md"

        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Content"
            name: "body"
            widget: "markdown"

      - label: "Gallery Page"
        name: "gallery"
        file: "_content/gallery.md"

        fields:
          - label: "Title"
            name: "title"
            widget: "string"

          - label: "Content"
            name: "body"
            widget: "markdown"
