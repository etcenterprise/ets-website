backend:
  name: github
  repo: etcenterprise/ets-website
  branch: eleventy
  base_url: https://ets-cms-auth.etcenterprise24.workers.dev

local_backend: false

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "_projects"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Project Title"
        name: "title"
        widget: "string"

      - label: "Client"
        name: "client"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Description"
        name: "body"
        widget: "markdown"

  - name: "services"
    label: "Services"
    folder: "_services"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Service Name"
        name: "title"
        widget: "string"

      - label: "Description"
        name: "body"
        widget: "markdown"

  - name: "audit"
    label: "Audit & Financial Solutions"
    folder: "_audit"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"

      - label: "Client"
        name: "client"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Description"
        name: "body"
        widget: "markdown"
  - name: "audit_team"
    label: "Audit Team"
    folder: "_audit_team"
    create: true
    slug: "{{slug}}"

    fields:
      - label: "Full Name"
        name: "title"
        widget: "string"

      - label: "Position"
        name: "position"
        widget: "string"

      - label: "Email"
        name: "email"
        widget: "string"

      - label: "Phone"
        name: "phone"
        widget: "string"

      - label: "Experience"
        name: "experience"
        widget: "string"

      - label: "Education"
        name: "education"
        widget: "string"

      - label: "Photo"
        name: "photo"
        widget: "image"
        required: false

      - label: "LinkedIn"
        name: "linkedin"
        widget: "string"
        required: false

      - label: "Facebook"
        name: "facebook"
        widget: "string"
        required: false

      - label: "Twitter"
        name: "twitter"
        widget: "string"
        required: false

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false

      - label: "Specializations"
        name: "specializations"
        widget: "list"

      - label: "Biography"
        name: "body"
        widget: "markdown"
  - name: "pages"
    label: "Website Pages"

    files:
      - label: "Home Page"
        name: "home"
        file: "_content/home.md"

        fields:
          - label: "Hero Title"
            name: "hero_title"
            widget: "string"

          - label: "Hero Text"
            name: "hero_text"
            widget: "text"

          - label: "Hero Button Text"
            name: "hero_button_text"
            widget: "string"

          - label: "Hero Button Link"
            name: "hero_button_link"
            widget: "string"

          - label: "About Section Title"
            name: "about_title"
            widget: "string"

          - label: "About Section Text"
            name: "about_text"
            widget: "text"

          - label: "CTA Title"
            name: "cta_title"
            widget: "string"

          - label: "CTA Button Text"
            name: "cta_button_text"
            widget: "string"

          - label: "CTA Button Link"
            name: "cta_button_link"
            widget: "string"
          - label: "Why Choose Us Title"
            name: "why_title"
            widget: "string"

          - label: "Why Choose Us Text"
            name: "why_text"
            widget: "text"

          - label: "Statistics - Projects Completed"
            name: "projects_completed"
            widget: "string"

          - label: "Statistics - Clients Served"
            name: "clients_served"
            widget: "string"

          - label: "Statistics - Years Experience"
            name: "years_experience"
            widget: "string"

          - label: "Statistics - Engineers"
            name: "engineers"
            widget: "string"

          - label: "Quote Section Title"
            name: "quote_title"
            widget: "string"

          - label: "Quote Section Text"
            name: "quote_text"
            widget: "text"

          - label: "WhatsApp Number"
            name: "whatsapp"
            widget: "string"

          - label: "WhatsApp Default Message"
            name: "whatsapp_message"
            widget: "text"
      - label: "About Page"
        name: "about"
        file: "_content/about.md"

        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"

          - label: "Content"
            name: "body"
            widget: "markdown"

      - label: "Contact Page"
        name: "contact"
        file: "_content/contact.md"

        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"

          - label: "Email"
            name: "email"
            widget: "string"

          - label: "Phone"
            name: "phone"
            widget: "string"

          - label: "Address"
            name: "address"
            widget: "text"

      - label: "Gallery Page"
        name: "gallery"
        file: "_content/gallery.md"

        fields:
          - label: "Page Title"
            name: "title"
            widget: "string"

          - label: "Subtitle"
            name: "subtitle"
            widget: "string"

          - label: "Content"
            name: "body"
            widget: "markdown"
      - label: "Audit Page"
        name: "audit"
        file: "_content/audit.md"

        fields:

          - {label: "Hero Title", name: "hero_title", widget: "string"}

          - {label: "Hero Text", name: "hero_text", widget: "text"}

          - {label: "Hero Button Text", name: "hero_button_text", widget: "string"}

          - {label: "Hero Button Link", name: "hero_button_link", widget: "string"}

          - {label: "About Title", name: "about_title", widget: "string"}

          - {label: "About Text", name: "about_text", widget: "text"}

          - {label: "Why Choose Us Title", name: "why_title", widget: "string"}

          - {label: "Why Choose Us Text", name: "why_text", widget: "text"}

          - {label: "Projects Completed", name: "projects_completed", widget: "string"}

          - {label: "Clients Served", name: "clients_served", widget: "string"}

          - {label: "Years Experience", name: "years_experience", widget: "string"}

          - {label: "Professional Auditors", name: "auditors", widget: "string"}

          - {label: "Quote Title", name: "quote_title", widget: "string"}

          - {label: "Quote Text", name: "quote_text", widget: "text"}

          - {label: "CTA Title", name: "cta_title", widget: "string"}

          - {label: "CTA Button Text", name: "cta_button_text", widget: "string"}

          - {label: "CTA Button Link", name: "cta_button_link", widget: "string"}
  - name: "navigation"
    label: "Navigation"

    files:
      - label: "Menu"
        name: "menu"
        file: "_content/navigation.yml"

        fields:
          - label: "Menu Items"
            name: "items"
            widget: "list"

            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "URL"
                name: "url"
                widget: "string"
  - name: "company"
    label: "Company Settings"

    files:
      - label: "Company Information"
        name: "company"
        file: "_content/company.md"

        fields:
          - label: "Company Name"
            name: "company_name"
            widget: "string"

          - label: "Tagline"
            name: "tagline"
            widget: "string"

          - label: "Email"
            name: "email"
            widget: "string"

          - label: "Phone"
            name: "phone"
            widget: "string"

          - label: "WhatsApp"
            name: "whatsapp"
            widget: "string"

          - label: "Address"
            name: "address"
            widget: "text"

          - label: "Office Hours"
            name: "office_hours"
            widget: "string"

          - label: "Google Maps"
            name: "google_maps"
            widget: "string"
            required: false

          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false

          - label: "LinkedIn"
            name: "linkedin"
            widget: "string"
            required: false

          - label: "Twitter (X)"
            name: "twitter"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "YouTube"
            name: "youtube"
            widget: "string"
            required: false

          - label: "Website"
            name: "website"
            widget: "string"
            required: false

          - label: "Copyright"
            name: "copyright"
            widget: "string"

          - label: "Company Logo"
            name: "logo"
            widget: "image"
            required: false

          - label: "Hero Image"
            name: "hero_image"
            widget: "image"
            required: false

          - label: "Favicon"
            name: "favicon"
            widget: "image"
            required: false
